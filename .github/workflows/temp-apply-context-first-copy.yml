name: 临时应用先沟通再执行文案

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-copy:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: 应用文案补丁
        run: python scripts/apply-context-first-copy.py
      - name: 精确提交并推送
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            app/src/components/QuestDashboard.tsx \
            public/case-study-alphafold-casp14.html \
            app/tests/e2e/quest-flow.spec.ts
          git diff --cached --quiet && { echo "目标文案已经存在。"; exit 0; }
          git commit -m "突出先沟通建 Context 再交给 Codex 执行"
          branch="${{ github.head_ref }}"
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin "HEAD:$branch"
