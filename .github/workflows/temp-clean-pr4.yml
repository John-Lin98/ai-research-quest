name: 临时清理 PR4 发布资产

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: 删除临时文档与脚本
        shell: bash
        run: |
          rm -f -- \
            docs/usage/v1-1-atomic-finalize-trigger.md \
            docs/usage/v1-1-final-ci-trigger.md \
            docs/usage/v1-1-user-ci-trigger.md \
            docs/usage/v1-1-video-trigger-final.md \
            docs/usage/v1-1-fix-trigger.md \
            docs/usage/v1-1-fix-trigger-{2..15}.md \
            scripts/apply-v1-1-all-fixes.py \
            scripts/temp-final-ui-fix.py \
            scripts/temp-v1-1-targeted-fixes.py
          git status --short
      - name: 精确提交清理
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- docs/usage scripts
          git diff --cached --quiet && { echo "临时文档与脚本已经清理。"; exit 0; }
          git commit -m "清理 v1.1 发布临时文档与脚本"
          git push origin "HEAD:${{ github.head_ref }}"
