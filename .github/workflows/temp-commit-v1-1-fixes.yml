name: 临时提交 v1.1 产品修复

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  commit-fixes:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: 生成修复并创建本地提交
        shell: bash
        run: |
          sed -i 's#\.github/workflows/generate-v1-1-video.yml#.github/workflows/video-generation.yml#g' scripts/apply-v1-1-all-fixes.py
          python scripts/apply-v1-1-all-fixes.py
          git restore -- scripts/apply-v1-1-all-fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/styles/research-quest.css \
            app/src/components/QuestDashboard.tsx \
            app/src/App.tsx \
            app/tests/e2e/quest-flow.spec.ts \
            skills/research-quest/SKILL.md \
            public/case-study-alphafold-casp14.html \
            README.md \
            docs/usage/social-copy.md \
            app/scripts/record-research-quest-demo.mjs \
            .github/workflows/video-generation.yml
          git status --short
          git diff --cached --quiet && { echo "修复已存在，无需提交。"; exit 0; }
          git commit -m "完善自适应关卡、自动认证与游戏界面"
      - name: 同步并重试推送
        shell: bash
        run: |
          branch="${{ github.head_ref }}"
          for attempt in 1 2 3; do
            echo "推送尝试 $attempt/3"
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              sleep 3
              continue
            fi
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep 3
          done
          echo "连续 3 次同步推送失败。"
          exit 1
