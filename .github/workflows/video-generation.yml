name: 临时生成新版 Research Quest 视频

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-video:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 安装锁定依赖
        run: npm ci --prefix app
      - name: 安装 Chromium
        run: npx --prefix app playwright install --with-deps chromium
      - name: 启动网页
        shell: bash
        run: |
          npm run dev --prefix app -- --host 127.0.0.1 --port 4174 > /tmp/research-quest-vite.log 2>&1 &
          echo $! > /tmp/research-quest-vite.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/research-quest-vite.log
          exit 1
      - name: 录制真实网页流程
        env:
          RESEARCH_QUEST_URL: http://127.0.0.1:4174/
          RESEARCH_QUEST_VIDEO: /tmp/research-quest-recording.webm
        run: node app/scripts/record-research-quest-demo.mjs
      - name: 压缩视频
        shell: bash
        run: |
          ffmpeg -y -i /tmp/research-quest-recording.webm -an -c:v libvpx-vp9 -crf 38 -b:v 0 -deadline good -cpu-used 2 public/research-quest-demo-75s.webm
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of default=noprint_wrappers=1 public/research-quest-demo-75s.webm
      - name: 精确提交视频
        shell: bash
        run: |
          if git diff --quiet -- public/research-quest-demo-75s.webm; then
            echo "视频内容没有变化。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/research-quest-demo-75s.webm
          git commit -m "更新四象限目标驱动演示视频"
          git push origin "HEAD:${{ github.head_ref }}"
