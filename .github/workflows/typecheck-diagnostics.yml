name: 临时浏览器测试诊断

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 安装锁定依赖
        run: npm ci --prefix app
      - name: 安装 Chromium
        run: npx --prefix app playwright install --with-deps chromium
      - name: 运行浏览器测试并保存日志
        id: e2e
        shell: bash
        continue-on-error: true
        run: |
          npm run test:e2e --prefix app -- --reporter=line > /tmp/playwright.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: 上传浏览器测试日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-log
          path: /tmp/playwright.log
          if-no-files-found: error
          retention-days: 1
      - name: 根据浏览器测试结果结束
        if: always()
        shell: bash
        run: |
          tail -n 80 /tmp/playwright.log
          test "${{ steps.e2e.outputs.status }}" = "0"
