name: 临时运行简化版 v1.1 产品修复

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  run-fixes:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: 应用完整修复
        id: fixes
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/apply-v1-1-all-fixes.py > /tmp/v1-1-all-fixes.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/v1-1-all-fixes.log
          exit "$status"
      - name: 上传完整修复日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-1-all-fixes-log
          path: /tmp/v1-1-all-fixes.log
          if-no-files-found: error
          retention-days: 1
      - name: 精确提交修复
        if: steps.fixes.outputs.status == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/styles/research-quest.css \
            app/src/components/QuestDashboard.tsx \
            app/src/App.tsx \
            app/tests/e2e/quest-flow.spec.ts \
            skills/research-quest/SKILL.md \
            public/case-study-alphafold-casp14.html \
            README.md \
            docs/usage/social-copy.md \
            app/scripts/record-research-quest-demo.mjs \
            .github/workflows/generate-v1-1-video.yml
          git commit -m "完善自适应关卡、自动认证与游戏界面"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: 根据修复结果结束
        if: always()
        shell: bash
        run: test "${{ steps.fixes.outputs.status }}" = "0"
