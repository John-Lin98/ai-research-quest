name: 临时运行简化版 v1.1 产品修复

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  run-fixes:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: 运行通用修复
        shell: bash
        run: |
          awk '
            /python - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/temp-apply-v1-1-product-fixes.yml > /tmp/apply-fixes.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply-fixes.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('# 3. 通过答案和小测自动补充认证证据。')
          end = text.index('# 5. Skill：任意需求动态生成关卡、自动认证、动态考试、强制游戏界面输出。')
          text = text[:start] + text[end:]
          old = """    if old not in text:\n        raise SystemExit(f'未找到待替换片段: {path}: {old[:80]!r}')\n    p.write_text(text.replace(old, new), encoding='utf-8')"""
          new = """    if old not in text:\n        if new in text:\n            return\n        raise SystemExit(f'未找到待替换片段: {path}: {old[:80]!r}')\n    p.write_text(text.replace(old, new), encoding='utf-8')"""
          if old not in text:
              raise SystemExit('未找到 replace helper')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python /tmp/apply-fixes.py
      - name: 运行自动认证补丁
        run: python scripts/temp-v1-1-targeted-fixes.py
      - name: 精确提交修复
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/styles/research-quest.css \
            app/src/components/QuestDashboard.tsx \
            app/src/App.tsx \
            app/tests/e2e/quest-flow.spec.ts \
            skills/research-quest/SKILL.md \
            public/case-study-alphafold-casp14.html \
            README.md \
            docs/usage/social-copy.md \
            app/scripts/record-research-quest-demo.mjs \
            .github/workflows/generate-v1-1-video.yml
          git commit -m "完善自适应关卡、自动认证与游戏界面"
          git push origin "HEAD:${{ github.head_ref }}"
