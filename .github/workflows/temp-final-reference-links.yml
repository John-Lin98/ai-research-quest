name: 临时应用最终参考链接补丁

on:
  push:
    branches: [agent/final-reference-links]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-reference-links
          persist-credentials: true
      - name: 应用补丁
        run: python scripts/temp-final-reference-links.py
      - name: 提交正式文件
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/case-study-alphafold-casp14.html docs/usage/social-copy.md app/tests/e2e/blog-v1-2.spec.ts
          git diff --cached --quiet && { echo "正式文件已是目标状态。"; exit 0; }
          git commit -m "补充认知地图与 grill-me 参考链接"
          git push origin HEAD:agent/final-reference-links
