name: 临时应用聊天界面精简补丁

on:
  push:
    branches: [agent/chat-ui-copy-feedback-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/chat-ui-copy-feedback-v1
          persist-credentials: true
      - name: 应用补丁
        run: python scripts/temp-chat-ui-polish.py
      - name: 提交产品文件
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/components/ChatQuestDemo.tsx
          git diff --cached --quiet && { echo "产品文件已是目标状态。"; exit 0; }
          git commit -m "精简选项复制反馈并重做用户气泡"
          git push origin HEAD:agent/chat-ui-copy-feedback-v1
