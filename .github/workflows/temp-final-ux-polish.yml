name: 临时应用 Demo 与博文最终可读性补丁

on:
  push:
    branches: [agent/chat-ui-copy-feedback-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/chat-ui-copy-feedback-v1
          persist-credentials: true
      - name: 应用补丁
        run: python scripts/temp-final-ux-polish.py
      - name: 提交正式文件
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/components/ChatQuestDemo.tsx \
            app/src/styles/chat-quest.css \
            public/case-study-alphafold-casp14.html \
            app/tests/e2e/chat-demo.spec.ts \
            app/tests/e2e/quest-flow.spec.ts
          git diff --cached --quiet && { echo "正式文件已是目标状态。"; exit 0; }
          git commit -m "优化聊天交互与发布博文可读性"
          git push origin HEAD:agent/chat-ui-copy-feedback-v1
