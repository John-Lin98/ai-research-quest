name: 临时原子化完成 PR4 界面收口

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-ui:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: 应用最终界面修复
        run: python scripts/temp-final-ui-fix.py
      - name: 提交并推送
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/components/QuestDashboard.tsx
          git diff --cached --quiet && { echo "最终界面已是目标状态。"; exit 0; }
          git commit -m "修正认知状态标签与自适应案例卡片"
          git push origin "HEAD:${{ github.head_ref }}"
