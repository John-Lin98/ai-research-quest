name: 临时应用最终博文传播补丁

on:
  push:
    branches: [agent/final-social-copy-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-social-copy-v1
          persist-credentials: true
      - name: 应用博文补丁
        run: python scripts/temp-final-social-blog.py
      - name: 提交正式文件
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/case-study-alphafold-casp14.html app/tests/e2e/blog-v1-2.spec.ts
          git diff --cached --quiet && { echo "正式文件已是目标状态。"; exit 0; }
          git commit -m "补充游戏 Skill 创作与克制交互说明"
          git push origin HEAD:agent/final-social-copy-v1
