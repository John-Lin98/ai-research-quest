name: 临时执行双语博文切换补丁

on:
  push:
    branches: [agent/bilingual-public-release-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/bilingual-public-release-v1
          persist-credentials: true
      - name: 应用补丁
        run: python scripts/temp-bilingual-blog-patch.py
      - name: 提交正式文件
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/case-study-alphafold-casp14.html
          git diff --cached --quiet && { echo "中文博文已是目标状态。"; exit 0; }
          git commit -m "为中文博文加入英文切换入口"
          git push origin HEAD:agent/bilingual-public-release-v1
